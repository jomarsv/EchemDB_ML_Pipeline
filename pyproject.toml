[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echemdb-ml-pipeline"
version = "0.1.2"
description = "Reproducible curation and assisted analysis of cyclic voltammograms"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jomar Sales Vasconcelos" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
echemdb-ml-pipeline = "echemdb_ml_pipeline.cli:main"
echemdb-web = "serve_app:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["serve_app"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/echemdb-ml-pipeline/app" = ["app/index.html", "app/app.js", "app/science.js", "app/styles.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
